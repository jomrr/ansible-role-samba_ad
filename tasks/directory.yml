---
# role: samba_ad
# file: tasks/directory.yml

- name: SAMBA_AD | Reserve DNS names against client registration
  jomrr.samba.samba_dns_record:
    zone: "{{ samba_ad_realm | lower }}"
    name: "{{ __samba_ad_reserved_name }}"
    type: A
    value: 127.0.0.1
    state: present
  loop: "{{ samba_ad_dns_reserved_names }}"
  loop_control:
    loop_var: __samba_ad_reserved_name

- name: SAMBA_AD | Create organizational units in parent-before-child order
  jomrr.samba.samba_ou:
    name: "{{ __samba_ad_ou.name }}"
    path: "{{ __samba_ad_ou.path }}"
    description: "{{ __samba_ad_ou.description | default(omit) }}"
    state: present
  loop: "{{ samba_ad_ous }}"
  loop_control:
    loop_var: __samba_ad_ou
    label: "{{ __samba_ad_ou.name }}"
  when: (__samba_ad_ou.state | default('present')) == 'present'

- name: SAMBA_AD | Manage domain users
  ansible.builtin.import_tasks: users.yml

- name: SAMBA_AD | Manage domain groups and memberships
  ansible.builtin.import_tasks: groups.yml

- name: SAMBA_AD | Remove empty organizational units in child-before-parent order
  jomrr.samba.samba_ou:
    name: "{{ __samba_ad_ou.name }}"
    path: "{{ __samba_ad_ou.path }}"
    state: absent
  loop: "{{ samba_ad_ous | reverse | list }}"
  loop_control:
    loop_var: __samba_ad_ou
    label: "{{ __samba_ad_ou.name }}"
  when: (__samba_ad_ou.state | default('present')) == 'absent'
