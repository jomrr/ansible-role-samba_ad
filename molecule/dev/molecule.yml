---
# role: samba_ad
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${SAMBA_AD_ROLE_REQUIREMENTS:-molecule/resources/requirements.yml}"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
        samba_ad_dns_zones:
          - name: "dns.molecule.test"
            aging: false
            norefresh_interval: 24
            refresh_interval: 36
          - name: "2.0.192.in-addr.arpa"
            replication: "forest"
            aging: false
            norefresh_interval: 12
            refresh_interval: 18
          - name: "retired.molecule.test"
        samba_ad_dns_records:
          - zone: "dns.molecule.test"
            name: "www"
            type: "A"
            value: "192.0.2.10"
          - zone: "dns.molecule.test"
            name: "www"
            type: "A"
            value: "192.0.2.11"
          - zone: "dns.molecule.test"
            name: "mail"
            type: "A"
            value: "192.0.2.20"
            ttl: 1200
          - zone: "2.0.192.in-addr.arpa"
            name: "20"
            type: "PTR"
            value: "mail.dns.molecule.test"
          - zone: "dns.molecule.test"
            name: "@"
            type: "MX"
            value: "mail.dns.molecule.test"
            preference: 10
          - zone: "dns.molecule.test"
            name: "_submission._tcp"
            type: "SRV"
            value: "mail.dns.molecule.test"
            priority: 5
            weight: 20
            port: 587
          - zone: "dns.molecule.test"
            name: "remove"
            type: "TXT"
            value: "retired record"
          - zone: "ad.example.test"
            name: "dns-fixture"
            type: "A"
            value: "192.0.2.30"
          - zone: "retired.molecule.test"
            name: "@"
            type: "TXT"
            value: "zone cleanup"
        samba_ad_ous:
          - name: "Molecule"
            path: "DC=ad,DC=example,DC=test"
          - name: "Staff"
            path: "OU=Molecule,DC=ad,DC=example,DC=test"
            description: "Initial staff OU"
          - name: "Groups"
            path: "OU=Molecule,DC=ad,DC=example,DC=test"
          - name: "Retired"
            path: "OU=Molecule,DC=ad,DC=example,DC=test"
          - name: "Children"
            path: "OU=Retired,OU=Molecule,DC=ad,DC=example,DC=test"
        samba_ad_users:
          - username: "moleculereader"
            password: "Molecule-Only-Reader1!"
          - username: "molecule-managed"
            password: "Molecule-Managed-Account1!"
            path: "OU=Staff,OU=Molecule,DC=ad,DC=example,DC=test"
            display_name: "Initial managed user"
            uid_number: 21001
            gid_number: 21000
          - username: "molecule-retired"
            password: "Molecule-Retired-Account1!"
            path: "OU=Children,OU=Retired,OU=Molecule,DC=ad,DC=example,DC=test"
        samba_ad_groups:
          - name: "molecule-parent-group"
            path: "OU=Groups,OU=Molecule,DC=ad,DC=example,DC=test"
            members:
              - "molecule-managed-group"
            members_purge: false
          - name: "molecule-managed-group"
            path: "OU=Groups,OU=Molecule,DC=ad,DC=example,DC=test"
            members:
              - "molecule-managed"
            description: "Initial managed group"
            gid_number: 21000
          - name: "molecule-scope-group"
            path: "OU=Groups,OU=Molecule,DC=ad,DC=example,DC=test"
            scope: "universal"
            category: "distribution"
            members:
              - "molecule-managed-group"
          - name: "molecule-audit-group"
            members:
              - "moleculereader"
          - name: "molecule-retired-group"
            path: "OU=Retired,OU=Molecule,DC=ad,DC=example,DC=test"
            members:
              - "molecule-retired"
        samba_ad_server: "dc1.ad.example.test"
        samba_ad_realm: "AD.EXAMPLE.TEST"
        samba_ad_admin_password: "Molecule-Only-Adm1n!"
        samba_ad_dc_hostname: "dc1"
        samba_ad_dc_realm: "{{ samba_ad_realm }}"
        samba_ad_dc_domain: "EXAMPLE"
        samba_ad_dc_admin_password: "{{ samba_ad_admin_password }}"
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  connection_options:
    ansible_user: "molecule"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "destroy"
  name: "dev"
platforms:
  - name: "samba-ad-almalinux"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-debian"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-fedora"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-suse"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
  - name: "samba-ad-ubuntu"
    hostname: "dc1"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    extra_opts:
      - "--tmpfs=/var/lib/samba:rw,size=1g,mode=0755"
